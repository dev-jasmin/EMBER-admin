
services:
  db:
    image: mariadb:10.4
    container_name: ember_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ember_root_password
      MARIADB_DATABASE: ember_db
      MARIADB_USER: ember_user
      MARIADB_PASSWORD: ember_password
    ports:
      - "3306:3306"
    volumes:
      - ember_db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ember_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  ember_db_data:
